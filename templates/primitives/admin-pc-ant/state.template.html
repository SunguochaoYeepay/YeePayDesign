<!-- admin-pc-ant：状态互斥，hidden 状态不可占用页面空间。 -->
<section class="ui-content-state" data-component="content-state" data-state="{{STATE}}" hidden>
  <span class="ui-state-icon" data-icon="{{STATE_ICON}}" aria-hidden="true"></span>
  <h2>{{STATE_TITLE}}</h2>
  <p>{{STATE_DESCRIPTION}}</p>
  <div class="ui-state-actions">{{STATE_ACTIONS}}</div>
</section>
