<!-- 历史结构参考。新结果页由固定 Ant Result 渲染 status，不手写状态图标。 -->
<section class="result-card card" data-result-status="{{STATUS}}">
  <div>
    <div class="result-icon" aria-hidden="true">{{STATUS_ICON}}</div>
    <h1 class="result-title">{{RESULT_TITLE}}</h1>
    <p class="result-desc">{{RESULT_DESCRIPTION}}</p>
    {{RESULT_SUMMARY}}
    <div class="result-actions">{{RESULT_ACTIONS}}</div>
  </div>
</section>
