<!-- query.basic / query.advanced：高级查询增加 data-collapsible="true" 和折叠按钮。 -->
<section class="search-card card" data-query="{{QUERY_TYPE}}">
  <div class="search-grid">
    {{QUERY_FIELDS}}
  </div>
  <div class="search-actions">
    {{QUERY_TOGGLE}}
    <button class="btn" type="button">重置</button>
    <button class="btn btn-primary" type="button">查询</button>
  </div>
</section>
