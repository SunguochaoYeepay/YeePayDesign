<!-- form.illustration：真实插图生成前使用此统一占位；窄屏时隐藏。 -->
<aside class="form-illustration" data-asset-key="{{ASSET_KEY}}" data-asset-status="{{ASSET_STATUS}}">
  <div class="form-illustration-placeholder" aria-hidden="true">{{ILLUSTRATION_MARK}}</div>
  <h2>{{ILLUSTRATION_TITLE}}</h2>
  <p>{{ILLUSTRATION_DESCRIPTION}}</p>
  <!-- 资产生成后，用下方结构替换 placeholder：
  <img src="{{ASSET_SRC}}" alt="{{ASSET_ALT}}">
  -->
</aside>
