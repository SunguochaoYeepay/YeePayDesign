page:
  name: 父表展开子表验证
  family: list
  presentation: page
  reason: 验证分账规则父表与入账明细子表的展开、收起、查询重置和客户端分页状态。
ui:
  platform: admin-pc-ant
  runtime: vue-ant
  rendererVersion: 2
content:
  capabilities: [query.basic, summary.count, table.toolbar, table.flat, table.pagination, table.link, table.status, table.amount, table.fixedActions, table.confirmAction, table.expandable, table.export, table.refresh, table.columnSettings]
  states: [loading, empty, error]
query:
  fields:
    - { key: ruleName, label: 规则名称, control: input, placeholder: 请输入规则名称, filterKey: ruleName }
    - key: status
      label: 规则状态
      control: select
      placeholder: 全部
      default: all
      options: [{ label: 全部, value: all }, { label: 生效中, value: active }, { label: 待生效, value: pending }, { label: 已失效, value: expired }]
table:
  rowKey: ruleId
  summaryTemplate: 共 {total} 条规则，其中生效中 {active} 条
  expandable:
    mode: multiple
    defaultExpanded: false
    childRowsKey: childRows
    childTable:
      rowKey: entryId
      columns:
        - { key: entryName, label: 入账方名称, ellipsis: true, width: 220 }
        - { key: accountType, label: 账户类型, width: 120 }
        - { key: accountNo, label: 收款账户, ellipsis: true, width: 188 }
        - { key: splitAmount, label: 分账金额, format: amount, currency: CNY, currencyDisplay: prefix, precision: 2, width: 148 }
        - { key: updatedAt, label: 最近更新时间, format: datetime, width: 176 }
  columns:
    - { key: ruleName, label: 规则名称, format: link, action: { key: detail, label: 查看 }, ellipsis: true, width: 190 }
    - { key: merchantNo, label: 商户编号, width: 142 }
    - { key: executionTime, label: 执行分账时间, ellipsis: true, width: 172 }
    - { key: splitAmount, label: 单日预计分账, format: amount, currency: CNY, currencyDisplay: prefix, precision: 2, width: 150 }
    - key: status
      label: 规则状态
      format: status
      width: 112
      statusMap:
        active: { label: 生效中, tone: success }
        pending: { label: 待生效, tone: processing }
        expired: { label: 已失效, tone: default }
    - { key: updatedAt, label: 最近更新时间, format: datetime, width: 176 }
    - { key: actions, label: 操作, fixed: right, required: true, width: 136 }
  rowActions:
    - { key: edit, label: 修改 }
    - { key: invalidate, label: 失效, danger: true, confirm: 确认将该规则置为失效？ }
  primaryAction: { key: create, label: 新增分账规则 }
  tools: [export, refresh, settings]
  pagination:
    total: 12
    page: 1
    pageSize: 8
    pageCount: 2
    pageSizeOptions: ['8', '20', '50']
  rows:
    - ruleId: E001
