page:
  name: 列表批量操作验证
  family: list
  presentation: page
  reason: 验证多选列、当前查询结果全选、当前页选择、反选、清空、跨页保留和批量动作禁用态。
ui:
  platform: admin-pc-ant
  runtime: vue-ant
  rendererVersion: 2
content:
  capabilities: [query.basic, summary.count, table.toolbar, table.flat, table.pagination, table.link, table.status, table.fixedActions, table.confirmAction, table.selection, table.batchActions, table.export, table.columnSettings]
  states: [loading, empty, error]
query:
  fields:
    - { key: ruleName, label: 规则名称, control: input, placeholder: 请输入规则名称, filterKey: ruleName }
    - key: status
      label: 规则状态
      control: select
      placeholder: 全部
      default: all
      options: [{ label: 全部, value: all }, { label: 生效中, value: active }, { label: 待生效, value: pending }, { label: 已失效, value: expired }]
table:
  rowKey: ruleId
  summaryTemplate: 共 {total} 条规则，其中生效中 {active} 条
  selection:
    mode: multiple
    itemLabel: 规则
    quickActions: [all-results, current-page, invert-current-page, clear]
  batchActions:
    - { key: batchEnable, label: 批量启用 }
    - { key: batchInvalidate, label: 批量失效, danger: true, confirm: 确认失效已选规则？ }
  columns:
    - { key: ruleName, label: 规则名称, format: link, action: { key: detail, label: 查看 }, ellipsis: true, width: 184 }
    - { key: merchantNo, label: 商户编号, width: 142 }
    - { key: executionTime, label: 执行分账时间, ellipsis: true, width: 172 }
    - key: status
      label: 规则状态
      format: status
      width: 112
      statusMap:
        active: { label: 生效中, tone: success }
        pending: { label: 待生效, tone: processing }
        expired: { label: 已失效, tone: default }
    - { key: createdAt, label: 创建时间, format: datetime, width: 176 }
    - { key: actions, label: 操作, fixed: right, required: true, width: 136 }
  rowActions:
    - { key: edit, label: 修改 }
    - { key: invalidate, label: 失效, danger: true, confirm: 确认将该规则置为失效？ }
  primaryAction: { key: create, label: 新增分账规则 }
  tools: [export, settings]
  pagination:
    total: 22
    page: 1
    pageSize: 20
    pageCount: 2
    pageSizeOptions: ['20', '50', '100']
  rows:
