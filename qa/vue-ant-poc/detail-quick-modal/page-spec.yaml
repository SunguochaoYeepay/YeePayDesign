page:
  name: 订单详情-弹窗核对
  family: detail
  presentation: modal
  reason: 用户从查询列表快速核对少量订单字段，无需滚动、编辑或关联明细。
ui:
  platform: admin-pc-ant
  runtime: vue-ant
  rendererVersion: 2
content:
  capabilities: [detail.quickView, detail.groups]
  states: [loading, error]
detail:
  title: 订单详情
  groups:
    - key: order
      title: 订单信息
      fields:
        - { key: payeeName, label: 收款方名称, value: 王丽丽 }
        - { key: paymentAmount, label: 付款金额, value: 0.01, format: amount, currency: CNY }
        - { key: merchantOrderNo, label: 商户订单号, value: '24052214150673550' }
        - { key: payeeAccount, label: 收款账户, value: 中国农业银行(0132) }
        - { key: receivedAmount, label: 到账金额, value: 0.01, format: amount, currency: CNY }
        - { key: orderTime, label: 下单时间, value: '2024-05-22 14:15:06', format: datetime }
        - { key: paymentNote, label: 付款附言, value: 实时到账 }
        - { key: serviceFee, label: 服务费, value: 0.01, format: amount, currency: CNY }
        - { key: completedAt, label: 完成时间, value: '2024-05-22 14:15:09', format: datetime }
        - { key: operator, label: 操作员, value: xxxx }
        - { key: orderStatus, label: 订单状态, value: 已到账, format: status, tone: success }
        - { key: orderRemark, label: 订单备注, value: xxxx }
        - { key: receivedType, label: 到账类型, value: 实时到账 }
        - { key: failureReason, label: 失败/冲退原因, value: 无 }
rules:
  - 弹窗详情只用于快速核对，关闭后回到来源列表，不承载编辑和关联明细。
