page:
  name: 列表复杂用法验证
  family: list
  presentation: page
  reason: 用于验证高级查询、日期范围、快捷日期、语义列、工具栏和固定行操作的统一 Vue/Ant 映射。
ui:
  platform: admin-pc-ant
  runtime: vue-ant
  rendererVersion: 2
content:
  capabilities: [query.advanced, query.dateRange, query.quickRanges, statistics.cards, table.toolbar, table.flat, table.pagination, table.link, table.tags, table.status, table.amount, table.fixedActions, table.confirmAction, table.export, table.refresh, table.columnSettings]
  states: [loading, empty, error]
query:
  collapsible: true
  collapseThreshold: 6
  defaultExpanded: true
  defaultQuickRange: last7days
  quickRanges: [today, yesterday, last3days, last7days]
  fields:
    - key: createdAt
      label: 创建时间
      control: date-range
      filterKey: createdAt
      showTime: false
      placeholder: [开始日期, 结束日期]
    - { key: ruleName, label: 规则名称, control: input, placeholder: 请输入规则名称, filterKey: ruleName }
    - { key: merchantNo, label: 商户编号, control: input, placeholder: 请输入商户编号, filterKey: merchantNo }
    - key: status
      label: 规则状态
      control: select
      placeholder: 全部
      default: all
      options: [{ label: 全部, value: all }, { label: 生效中, value: active }, { label: 待生效, value: pending }, { label: 已失效, value: expired }]
    - key: channel
      label: 分账渠道
      control: select
      placeholder: 全部
      default: all
      advanced: true
      options: [{ label: 全部, value: all }, { label: 线上收单, value: online }, { label: 直营网点, value: store }, { label: 联营渠道, value: partner }]
    - { key: ruleId, label: 规则编号, control: input, placeholder: 请输入规则编号, filterKey: ruleId, advanced: true }
table:
  rowKey: ruleId
  columns:
    - { key: ruleName, label: 规则名称, format: link, action: { key: detail, label: 查看 }, ellipsis: true, width: 184 }
    - { key: merchantNo, label: 商户编号, ellipsis: true, width: 142 }
    - key: channels
      label: 分账渠道
      format: tag
      width: 148
      tagMap:
        online: { label: 线上收单, tone: blue }
        store: { label: 直营网点, tone: green }
        partner: { label: 联营渠道, tone: gold }
    - key: status
      label: 规则状态
      format: status
      width: 112
      statusMap:
        active: { label: 生效中, tone: success }
        pending: { label: 待生效, tone: processing }
        expired: { label: 已失效, tone: default }
    - { key: pendingAmount, label: 待分账金额, format: amount, currency: CNY, currencyDisplay: prefix, precision: 2, width: 142 }
    - { key: createdAt, label: 创建时间, format: datetime, width: 176 }
    - { key: actions, label: 操作, fixed: right, required: true, width: 136 }
  rowActions:
    - { key: edit, label: 修改 }
    - { key: invalidate, label: 失效, danger: true, confirm: 确认将该规则置为失效？ }
  secondaryActions:
    - { key: batchConfig, label: 批量配置 }
  primaryAction: { key: create, label: 新增分账规则 }
  tools: [export, refresh, settings]
  pagination:
    total: 22
    page: 1
    pageSize: 20
    pageCount: 2
    pageSizeOptions: ['20', '50', '100']
  rows:
    - { ruleId: R001, ruleName: 连锁门店分润, merchantNo: '10080048989', channels: [online, store], status: active, pendingAmount: 12860.32, createdAt: '2026-07-16 11:35:22' }
    - { ruleId: R002, ruleName: 联合运营, merchantNo: '10080048989', channels: [partner], status: active, pendingAmount: 9820, createdAt: '2026-07-15 16:20:10' }
