    - { ruleId: R004, ruleName: 全部按月, merchantNo: '10080048991', channels: [store], status: pending, pendingAmount: 4280, createdAt: '2026-07-14 12:32:00' }
    - { ruleId: R005, ruleName: 月周期收单, merchantNo: '10080048992', channels: [online], status: active, pendingAmount: 3860.06, createdAt: '2026-07-14 11:35:22' }
    - { ruleId: R006, ruleName: 实时交易, merchantNo: '10080048993', channels: [online, partner], status: active, pendingAmount: 3570.18, createdAt: '2026-07-13 18:45:11' }
    - { ruleId: R007, ruleName: 订单金额比例, merchantNo: '10080048994', channels: [store], status: expired, pendingAmount: 0, createdAt: '2026-07-13 11:35:22', actions: [{ key: detail, label: 详情 }, { key: download, label: 下载 }] }
