    - { ruleId: R022, ruleName: 城市代理商分润, merchantNo: '10080049009', channels: [partner], status: active, pendingAmount: 6420.9, createdAt: '2026-07-07 11:20:43' }
statistics:
  layout: standard
  items:
    - { key: totalRules, label: 规则总数, format: number, aggregate: { op: count } }
    - { key: activeRules, label: 生效中规则, format: number, aggregate: { op: count, where: { field: status, equals: active } } }
    - { key: pendingAmount, label: 待分账金额, unit: 元, format: amount, aggregate: { op: sum, field: pendingAmount } }
assumptions:
  - 该 POC 使用 22 条结构化演示数据，验证默认 20 条/页和第二页。
  - 工具栏、行操作与列设置仅演示前端交互反馈；真实业务接口由宿主接入。
